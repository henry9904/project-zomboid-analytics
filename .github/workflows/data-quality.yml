name: Data Quality

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  etl-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ETL on fixture data
        run: python -m etl --input tests/fixtures --db /tmp/zomboid.db --verbose

      - name: Verify warehouse row counts
        run: |
          python - <<'PY'
          import sqlite3
          conn = sqlite3.connect("/tmp/zomboid.db")
          for t in ("player_stats", "zombie_sightings", "noise_events", "inventory_snapshots"):
              n = conn.execute(f"SELECT COUNT(*) FROM {t}").fetchone()[0]
              print(f"{t}: {n}")
              assert n > 0, f"{t} is empty"
          PY

      - name: Run data-quality tests
        run: pytest -q --maxfail=1
